# Render.com 무료 테스트 서버 설정 (Blueprint)
# Render 대시보드 → New → Blueprint → 이 저장소 선택 → Apply 만 누르면 배포됨
# 주의: 무료 플랜은 15분 동안 접속이 없으면 잠들고(첫 접속 30초~1분), 재시작 시 데이터가 초기화됨 → 테스트 전용
services:
  - type: web
    name: withmj
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 22.22.0   # node:sqlite 는 22.13 이상에서 플래그 없이 동작
      - key: DEMO_SEED
        value: "1"
      - key: ADMIN_EMAIL
        value: admin@withmj.kr
      - key: ADMIN_PASSWORD
        sync: false   # 배포할 때 Render 화면에서 직접 입력 (운영자 비밀번호)
      - key: KAKAO_PROVIDER
        value: mock
      - key: PAYMENT_PROVIDER
        value: mock
